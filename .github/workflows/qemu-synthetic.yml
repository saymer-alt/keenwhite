# Heavy QEMU synthetic checks run ONLY when transport sources change
# (paths filter) or manually. Pure Go user-mode emulation of the
# cross-built binaries; no network, no devices, no credentials, and never
# a substitute for physical acceptance (KeenWhite issue #3).
#
# Build steps here are AUTHORITATIVE and unmasked: a real WDTT build
# failure fails the job. QEMU user-mode is NOT the Keenetic emulator and
# NOT physical acceptance. The nested WDTT module (transports/wdtt/go_client)
# pins its own Go version, so it is built with its own toolchain.
name: QEMU synthetic (transports)
on:
  pull_request:
    paths:
      - 'transports/**'
      - '.github/workflows/qemu-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-user-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Crossbuild core for arm64/mipsle
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/keenwhite-linux-arm64 ./cmd/keenwhite
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -o dist/keenwhite-linux-mipsle ./cmd/keenwhite
      - name: Install qemu-user-static (distribution package)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
      - name: Synthetic smoke under QEMU (offline commands only)
        run: |
          qemu-aarch64-static ./dist/keenwhite-linux-arm64 version
          qemu-aarch64-static ./dist/keenwhite-linux-arm64 validate -catalog examples/providers.json
          qemu-mipsel-static ./dist/keenwhite-linux-mipsle version
          qemu-mipsel-static ./dist/keenwhite-linux-mipsle validate -catalog examples/providers.json
      - name: Install Go for the nested WDTT module (its own go.mod pins the version)
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: transports/wdtt/go_client/go.mod
          cache: false
      - name: Build imported WDTT go_client (arm64) — authoritative, unmasked
        working-directory: transports/wdtt/go_client
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/wdtt-client-arm64 .
          test -s /tmp/wdtt-client-arm64
          sha256sum /tmp/wdtt-client-arm64
      - name: Build imported WDTT go_client (mipsle) — authoritative, unmasked
        working-directory: transports/wdtt/go_client
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -o /tmp/wdtt-client-mipsle .
          test -s /tmp/wdtt-client-mipsle
          sha256sum /tmp/wdtt-client-mipsle
      - name: Record explicit build evidence
        if: always()
        run: |
          {
            echo "## WDTT go_client build (authoritative, unmasked)"
            echo "- arm64 and mipsle build steps above are hard gates; no skip paths exist."
            echo "- QEMU user-mode is NOT the Keenetic emulator and NOT physical acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
