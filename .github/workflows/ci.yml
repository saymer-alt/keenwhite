name: CI — offline contract and crossbuild
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format check
        run: |
          test -z "$(gofmt -l cmd internal)"
      - name: Vet and tests
        run: |
          go vet ./...
          go test -race ./...
      - name: Emulator harness (offline fake) + report artifact
        run: |
          go test -race -count=1 -run 'TestAllScenarios' ./internal/harness/ -v
          KW_HARNESS_REPORT=${{ github.workspace }}/harness-report.json go test -count=1 -run 'TestAllScenarios' ./internal/harness/ >/dev/null
          test -s harness-report.json
      - name: Upload harness report (secret-free by construction)
        if: always()
        uses: actions/upload-artifact@v4 # TODO: pin by commit SHA repo-wide (follow-up)
        with:
          name: harness-report
          path: harness-report.json
          if-no-files-found: warn
      - name: Build-only portability checks (NOT hardware acceptance)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/keenwhite-linux-arm64 ./cmd/keenwhite
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -o dist/keenwhite-linux-mipsle ./cmd/keenwhite
          sha256sum dist/*
          file dist/*
