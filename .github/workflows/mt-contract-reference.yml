# Synthetic reference tests migrated from KAS MT-001/MT-002.
name: Reference MT contract tests
on:
  pull_request:
    paths:
      - '.github/workflows/mt-contract-reference.yml'
      - 'docs/research/multitransport/**'
      - 'tests/multitransport-contract.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned test-only jsonschema dependency
        run: python -m pip install 'jsonschema==4.26.0'
      - name: KAS v0 snapshot 33 synthetic checks, offline script
        run: python tests/multitransport-contract.py --now 2026-10-21T12:00:00Z
